<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ReadyWriter</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header>

        <nav class="main-nav">

            <a href="/" class="logo">
                ReadyWriter
            </a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/books">Books</a>
                <a href="/drafts">My Drafts</a>
                <a href="/jobs">Jobs</a>
                <a href="/community">Community</a>
            </div>

        </nav>

    </header>

    <main class="chapter-page">

        <p class="back-to-home">
            <a href="/">← Back to Home</a>
        </p>

        <p class="section-label">
            JOIN READYWRITER
        </p>

        <h1>
            Create your
            <span>account.</span>
        </h1>

        <p class="write-intro">
            Join ReadyWriter as a reader or writer and start
            building your place in the writing community.
        </p>

        <form action="/register" method="POST">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <label for="role">
                I want to
            </label>

            <select
                id="role"
                name="role"
                required
            >
                <option value="reader">
                    Read and join the community
                </option>

                <option value="writer">
                    Write and publish stories
                </option>
            </select>

            <div class="form-buttons">

                <button type="submit">
                    Create Account
                </button>

            </div>

        </form>

    </main>

</body>

</html>
