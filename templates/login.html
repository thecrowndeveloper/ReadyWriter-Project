<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | InkHobby</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header>

        <nav class="main-nav">

            <a href="/" class="logo">
                InkHobby
            </a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/books">Books</a>
                <a href="/register">Create Account</a>
            </div>

        </nav>

    </header>

    <main class="chapter-page">

        <p class="back-to-home">
            <a href="/">← Back to Home</a>
        </p>

        <p class="section-label">
            WELCOME BACK
        </p>

        <h1>
            Log
            <span>in here.</span>
        </h1>

        <p class="write-intro">
            Welcome back to InkHobby.
            Continue your stories, discover new books,
            and stay connected with the community.
        </p>

        <form action="/login" method="POST">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Your password"
                required
            >

            <div class="form-buttons">

                <button type="submit">
                    Log In
                </button>

            </div>

        </form>

    </main>

</body>

</html>
